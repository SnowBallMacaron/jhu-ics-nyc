name: Update JHU calendar (NY time)

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate docs/calendar.ics
        run: python fix.py

      - name: Commit & push if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add docs/calendar.ics
          git diff --cached --quiet || (git commit -m "Update calendar.ics" && git push)
